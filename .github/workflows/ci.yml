name: CI (Syntax-Check)

# Läuft nur für Feature-Branches & Pull Requests.
# Auf main/develop prüft der Deploy-Workflow die Syntax selbst vor dem Ausrollen (keine doppelten Läufe).
on:
  push:
    branches-ignore: ["main", "develop"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python kompilieren
        run: python -m py_compile server/*.py
      - name: JavaScript prüfen
        run: |
          find public/src -name "*.js" -print0 | xargs -0 -n1 node --check
