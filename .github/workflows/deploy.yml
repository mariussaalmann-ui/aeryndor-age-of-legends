name: Deploy

# main    -> Live-Server    (Port 8090)
# develop -> Staging-Server (Port 8091)
# Benötigte Repository-Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-Check vor Deploy (Python + JavaScript)
        run: |
          python3 -m py_compile server/*.py
          find public/src -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Deploy per SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            if [ "${{ github.ref_name }}" = "main" ]; then
              bash /opt/aeryndor/tools/deploy.sh live
            else
              bash /opt/aeryndor/tools/deploy.sh staging
            fi
